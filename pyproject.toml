[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "torch-flash"
version = "0.2.0"
description = "Differentiable phase-equilibrium flash calculations built on PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-2.1-only"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md", "docs/licensing.md"]
authors = [
  { name = "Diego Volpatto", email = "volpatto@lncc.br" },
  {name = "Antonio Marinho", email = "marinhoengenharias@gmail.com"},
  {name = "Gustavo Ribeiro", email = "ggrbill@gmail.com"},
]
keywords = [
  "autodiff",
  "chemical-equilibrium",
  "equation-of-state",
  "flash-calculation",
  "pytorch",
  "thermodynamics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "chemicals>=1.5.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "torch>=2.4,<3",
  "typing_extensions>=4.10",
]

[project.optional-dependencies]
groups = [
  "ugropy>=3.2,<4",
]
intel = [
  "pypardiso>=0.4; sys_platform == 'linux' or sys_platform == 'win32'",
]
gpu = [
  "nvmath-python>=0.9; sys_platform == 'linux' or sys_platform == 'win32'",
  "torch-sla[all]; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/ThermoPhase-FCSRG/torch-flash"
Documentation = "https://thermophase-fcsrg.github.io/torch-flash"
Repository = "https://github.com/ThermoPhase-FCSRG/torch-flash"
Issues = "https://github.com/ThermoPhase-FCSRG/torch-flash/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_flash"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "CITATION.cff",
  "docs/licensing.md",
  "docs/references.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "external: requires an optional external thermodynamic package",
  "serial: resource-intensive or process-global test that must run without concurrent tests",
  "slow: exhaustive scientific or numerical regression test",
]

[tool.coverage.run]
branch = true
source = ["torch_flash"]

[tool.coverage.report]
fail_under = 99
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
