name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          cache: true
          environments: default
          locked: true
      - name: Dependency metadata
        run: pixi run -e default python scripts/sync_deps.py --check
      - name: Research-data rights ledger
        run: pixi run -e default check-data-rights
      - name: Lint and formatting
        run: |
          pixi run -e default lint
          pixi run -e default format-check
      - name: Type check
        run: pixi run -e default typecheck
      - name: Fetch pinned Whitson contest corpus
        shell: bash
        run: |
          contest="${RUNNER_TEMP}/Rachford-Rice-Contest"
          git init "$contest"
          git -C "$contest" remote add origin https://github.com/WhitsonAS/Rachford-Rice-Contest.git
          git -C "$contest" fetch --depth 1 origin 503b92f1b2847c4459326841f538739bcb9d629f
          git -C "$contest" checkout --detach FETCH_HEAD
          echo "TORCH_FLASH_WHITSON_DATA=${contest}" >> "$GITHUB_ENV"
      - name: Tests and coverage
        shell: bash
        run: |
          set -o pipefail
          pixi run -e default test-cov 2>&1 | tee coverage.txt
      - name: Prepare coverage report
        if: always()
        shell: bash
        run: |
          {
            echo "## torch-flash test coverage"
            echo
            echo '```text'
            tail -n 45 coverage.txt
            echo '```'
          } > coverage-comment.md
      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: torch-flash-coverage
          path: coverage-comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.txt

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          cache: true
          environments: test
          locked: true
      - run: pixi run -e test test

  macos-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          cache: true
          environments: test
          locked: true
      - run: pixi run -e test test

  package-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          cache: true
          environments: default docs
          locked: true
      - name: Build distributions
        run: |
          pixi run -e default build
          pixi run -e default twine check dist/*
          pixi run -e default check-dist
      - name: Build documentation
        run: pixi run -e docs mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
