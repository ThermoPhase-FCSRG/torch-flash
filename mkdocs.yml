site_name: torch-flash
site_description: Differentiable thermodynamic properties and phase-equilibrium calculations on PyTorch
site_url: https://thermophase-fcsrg.github.io/torch-flash/
repo_url: https://github.com/ThermoPhase-FCSRG/torch-flash
repo_name: ThermoPhase-FCSRG/torch-flash
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  logo: assets/branding/thermophase-horizontal.png
  favicon: assets/branding/thermophase-horizontal.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/thermophase.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ThermoPhase-FCSRG/torch-flash
      name: torch-flash on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/torch-flash/
      name: torch-flash on PyPI

copyright: torch-flash contributors · ThermoPhase research group · LNCC · UDESC

nav:
  - Home: index.md
  - Guides:
      - Runtime configuration: runtime.md
      - Parameter databases: parameters.md
      - Model scope: model-scope.md
      - Performance: performance.md
  - Verification & Validation:
      - Overview: validation.md
      - Validation reports:
          - GERG-2008 and EOS-CG: validation-reports/05-gerg-eoscg.md
          - Native EOS-CG-2021: validation-reports/08-eoscg2021.md
          - Thermal properties: validation-reports/15-thermal-properties.md
          - Huron-Vidal mixing: validation-reports/22-huron-vidal.md
          - Volume translation: validation-reports/24-volume-translation.md
          - Cross-co-volume interaction: validation-reports/25-covolume-interaction.md
          - Original UNIFAC: validation-reports/26-unifac.md
          - Predictive PR78: validation-reports/28-ppr78.md
  - Reference:
      - Scientific references: references.md
      - API reference: api.md
      - Licensing and data provenance: licensing.md
  - Development:
      - Contributing: contributing.md
