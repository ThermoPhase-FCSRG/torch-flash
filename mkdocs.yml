site_name: torch-flash
site_description: Differentiable thermodynamic properties and phase-equilibrium calculations on PyTorch
site_url: https://thermophase-fcsrg.github.io/torch-flash/
repo_url: https://github.com/ThermoPhase-FCSRG/torch-flash
repo_name: ThermoPhase-FCSRG/torch-flash
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  logo: assets/branding/thermophase-horizontal.png
  favicon: assets/branding/thermophase-horizontal.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: table
            merge_init_into_class: true
            show_bases: true
            show_docstring_attributes: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/thermophase.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ThermoPhase-FCSRG/torch-flash
      name: torch-flash on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/torch-flash/
      name: torch-flash on PyPI

copyright: torch-flash contributors · ThermoPhase research group · LNCC · UDESC

