$schema: https://json-schema.org/draft/2020-12/schema
$id: https://volpatto.github.io/torch-flash/schemas/model-parameters-v1
title: torch-flash model parameter set
type: object
additionalProperties: false
required:
  - format
  - schema_version
  - id
  - model_kind
  - model
  - version
  - units
  - references
  - parameters
properties:
  format:
    const: torch-flash-model-parameters
  schema_version:
    const: 1
  id:
    type: string
    minLength: 1
    pattern: "^[a-z0-9][a-z0-9._-]*$"
  model_kind:
    enum:
      - activity
      - binary_interaction
      - cpa
      - cubic
      - group_contribution
      - multifluid
      - standard_state
      - volume_translation
  model:
    type: string
    minLength: 1
  version:
    type: string
    minLength: 1
  description:
    type: string
  units:
    type: object
    additionalProperties:
      type: string
      minLength: 1
  references:
    type: array
    items:
      type: object
      minProperties: 1
      additionalProperties:
        type: string
  parameters:
    type: object
