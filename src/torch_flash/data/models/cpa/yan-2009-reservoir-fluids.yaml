format: torch-flash-model-parameters
schema_version: 1
id: cpa.yan-2009-reservoir-fluids
model_kind: cpa
model: SRK-CPA reservoir fluids
version: "2009"
description: >-
  Reservoir-fluid CPA setup from Yan, Kontogeorgis, and Stenby (2009). The
  temperature-dependent light-hydrocarbon/water BIPs and C7+ monomer
  characterization coefficients are from that paper. Light-hydrocarbon and
  water pure parameters are the Oliveira et al. (2007) values used for a
  traceable bundled setup; Yan et al. refer those pure parameters to earlier
  CPA literature rather than reproducing their table.
units:
  critical_temperature: K
  a0: Pa m^6 mol^-2
  b: m^3 mol^-1
  c1: dimensionless
  association_energy: J mol^-1
  association_volume: dimensionless
  binary_interaction_a: dimensionless
  binary_interaction_b: K
  normal_boiling_pressure: Pa
references:
  - citation: >-
      Yan, Kontogeorgis, and Stenby, Fluid Phase Equilibria 276 (2009) 75-85
    doi: 10.1016/j.fluid.2008.10.007
  - citation: >-
      Oliveira, Coutinho, and Queimada, Fluid Phase Equilibria 258 (2007)
      58-66
    doi: 10.1016/j.fluid.2007.05.023
