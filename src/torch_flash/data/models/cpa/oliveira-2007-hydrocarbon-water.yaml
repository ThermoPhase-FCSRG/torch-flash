format: torch-flash-model-parameters
schema_version: 1
id: cpa.oliveira-2007-hydrocarbon-water
model_kind: cpa
model: SRK-CPA
version: "2007"
description: >-
  Hydrocarbon-water CPA parameters from Oliveira, Coutinho, and Queimada
  (2007), Tables 1-3. Aromatics use one electron-acceptor solvation site and
  the paper's modified-CR1 cross energy (half the water self-association
  energy). This parameterization does not reproduce the low-temperature
  hydrophobic solubility minimum identified by the authors.
units:
  critical_temperature: K
  a0: Pa m^6 mol^-2
  b: m^3 mol^-1
  c1: dimensionless
  association_energy: J mol^-1
  association_volume: dimensionless
  binary_interaction: dimensionless
  cross_association_energy: J mol^-1
  cross_association_volume: dimensionless
references:
  - citation: >-
      Oliveira, Coutinho, and Queimada, Fluid Phase Equilibria 258 (2007)
      58-66
    doi: 10.1016/j.fluid.2007.05.023
